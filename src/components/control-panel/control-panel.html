<main class="control-panel">
  <div class="control-panel__map">
    <map-panel></map-panel>
  </div>

  <div class="control-panel__main">
    <robot-preview></robot-preview>

    <div class="tabs" role="tablist" aria-label="Sections" (keydown)="onTabKey($event)">
      @for (t of tabs; track t.id) {
        <button
          type="button"
          class="tab"
          role="tab"
          [id]="'tab-' + t.id"
          [attr.aria-selected]="tab() === t.id"
          [attr.aria-controls]="'panel-' + t.id"
          [attr.tabindex]="tab() === t.id ? 0 : -1"
          (click)="tab.set(t.id)"
        >
          {{ t.label }}
        </button>
      }
    </div>

    <!-- Both panels stay mounted (just hidden) so a calibration run and its recorded rows survive a tab switch. -->
    <div
      class="tab-panel"
      role="tabpanel"
      id="panel-drive"
      aria-labelledby="tab-drive"
      [hidden]="tab() !== 'drive'"
    >
      <steering></steering>
      <pose-display></pose-display>
      <log-panel></log-panel>
    </div>
    <div
      class="tab-panel"
      role="tabpanel"
      id="panel-calibration"
      aria-labelledby="tab-calibration"
      [hidden]="tab() !== 'calibration'"
    >
      <sensor-calibration></sensor-calibration>
    </div>
  </div>
</main>
