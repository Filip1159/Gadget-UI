<h2>Steering</h2>
<div class="steering">
  <div class="steering__speed">
    <span class="muted">Speed</span>
    <slider [value]="speed()" (valueChange)="setSpeed($event)"></slider>
    <span class="steering__speed-value">{{ speed() }}</span>
  </div>

  <div class="steering__direction">
    <longpress-button
      label="Forward Left"
      [disabled]="!connected()"
      (press)="move('FORWARD_LEFT')"
      (release)="move('STOP')"
    >
      <fa-icon [icon]="faAngleUp" rotate="-45deg" size="3x" />
    </longpress-button>
    <longpress-button
      label="Forward"
      [disabled]="!connected()"
      (press)="move('FORWARD')"
      (release)="move('STOP')"
    >
      <fa-icon [icon]="faAngleUp" size="3x" />
    </longpress-button>
    <longpress-button
      label="Forward Right"
      [disabled]="!connected()"
      (press)="move('FORWARD_RIGHT')"
      (release)="move('STOP')"
    >
      <fa-icon [icon]="faAngleUp" rotate="45deg" size="3x" />
    </longpress-button>
    <longpress-button
      label="Left"
      [disabled]="!connected()"
      (press)="move('LEFT')"
      (release)="move('STOP')"
    >
      <fa-icon [icon]="faAngleUp" rotate="-90deg" size="3x" />
    </longpress-button>
    <button class="button button--stop" aria-label="Stop" (click)="move('STOP')">
      <fa-icon [icon]="faArrowsToCircle" size="2x" />
    </button>
    <longpress-button
      label="Right"
      [disabled]="!connected()"
      (press)="move('RIGHT')"
      (release)="move('STOP')"
    >
      <fa-icon [icon]="faAngleUp" rotate="90deg" size="3x" />
    </longpress-button>
    <longpress-button
      label="Backward Left"
      [disabled]="!connected()"
      (press)="move('BACKWARD_LEFT')"
      (release)="move('STOP')"
    >
      <fa-icon [icon]="faAngleUp" rotate="225deg" size="3x" />
    </longpress-button>
    <longpress-button
      label="Backward"
      [disabled]="!connected()"
      (press)="move('BACKWARD')"
      (release)="move('STOP')"
    >
      <fa-icon [icon]="faAngleUp" rotate="180deg" size="3x" />
    </longpress-button>
    <longpress-button
      label="Backward Right"
      [disabled]="!connected()"
      (press)="move('BACKWARD_RIGHT')"
      (release)="move('STOP')"
    >
      <fa-icon [icon]="faAngleUp" rotate="135deg" size="3x" />
    </longpress-button>
  </div>

  <form class="steering__pid">
    <span class="muted">PID gains</span>
    <div class="field">
      <label class="steering__pid__label" for="P">P:</label>
      <input id="P" type="number" name="P" step="0.01" [(ngModel)]="P" />
    </div>
    <div class="field">
      <label class="steering__pid__label" for="I">I:</label>
      <input id="I" type="number" name="I" step="0.01" [(ngModel)]="I" />
    </div>
    <div class="field">
      <label class="steering__pid__label" for="D">D:</label>
      <input id="D" type="number" name="D" step="0.001" [(ngModel)]="D" />
    </div>
    <button class="primary" type="button" [disabled]="!pidValid()" (click)="setPid()">
      Set PID
    </button>
  </form>
</div>
